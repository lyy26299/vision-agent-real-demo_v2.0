[project]
name = "vision-agent-real-demo"
version = "1.0.0"
description = "基于 Vision-Agents 的实时交互感知演示"
requires-python = ">=3.13"
dependencies = [
    "vision-agents[gemini,getstream,local,qwen,ultralytics]>=0.6.9",
    "python-dotenv>=1.0.0",
    "certifi>=2024.8.30",
]

[project.optional-dependencies]
openai = ["vision-agents[openai]"]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["vision_agent_demo"]

[tool.vision-agents.agent]
entrypoint = "vision_agent_demo:runner"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
